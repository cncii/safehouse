# pixel_art_texture.cfg — 像素美术纹理导入预设（文档化预设）
#
# 用法（详见同目录 README.md §2 / §4）：
#   1. 把下面 [params] 段整段贴进每个像素美术资源对应的 <资源名>.png.import 的 [params] 段。
#   2. 不要碰 [remap] / [deps] 段（uid / path / dest_files 由 Godot 引擎维护）。
#   3. 跑 Godot --headless --import 让引擎补全 [remap]/[deps]，再跑门禁：
#        python tools/check_import_presets.py
#        python tools/check_assets.py
#
# 设计意图（契约依据）：
#   - compress/mode=0      有损压缩会改像素色值 → 直接从 32 色膨胀，违反 S2。
#   - mipmaps/generate=false  /  filter=Nearest   2D 像素图开 mipmap 或线性过滤 → 远处糊边。
#   - process/fix_alpha_border=false  会改边缘像素颜色；本项目锁 NEAREST + 整数缩放，要求像素零改动。
#   - detect_3d/compress_to=0  默认 1：素材一旦被 3D 节点引用就自动转 VRAM 压缩，画质悄悄掉了还没人知道。
#   - process/size_limit=0  不许自动缩图（缩了 16px 栅格就废了，违反 S1）。

[params]

compress/mode=0
compress/high_quality=false
compress/normal_map=0
compress/channel_pack=0
mipmaps/generate=false
process/fix_alpha_border=false
process/premult_alpha=false
process/size_limit=0
detect_3d/compress_to=0
